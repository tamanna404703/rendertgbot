services:
  - type: web
    name: telegram-bot-api
    env: docker
    plan: free # Change to starter/standard if you need more resources
    region: oregon # Choose your preferred region (e.g., Frankfurt, Ohio, etc.)
    ports:
      - 8081:8081
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
    disk:
      name: bot-api-data
      mountPath: /var/lib/telegram-bot-api
      sizeGB: 1
    startCommand: "--local --dir=/var/lib/telegram-bot-api --http-port=8081"
